<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Hour - Spotify Game</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // PKCE helper functions
        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        }

        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        }

        function base64encode(input) {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');
        }

        const PlayIcon = () => (
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
        );

        const PauseIcon = () => (
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
        );

        const MusicIcon = () => (
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
            </svg>
        );

        function PowerHourGame() {
            const [step, setStep] = useState(1);
            const [spotifyToken, setSpotifyToken] = useState(null);
            const [deviceId, setDeviceId] = useState(null);
            const [player, setPlayer] = useState(null);
            const [playlistCriteria, setPlaylistCriteria] = useState({
                genre: '',
                timePeriod: ''
            });
            const [playlist, setPlaylist] = useState([]);
            const [gameSettings, setGameSettings] = useState({
                rounds: 60,
                roundLength: 60
            });
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentRound, setCurrentRound] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [currentTrack, setCurrentTrack] = useState(null);
            const timerRef = useRef(null);

            const CLIENT_ID = '8fc1832fa4174a4f91be79ec44113742';
            const REDIRECT_URI = 'https://aatopini.github.io/power-hour-app/';
            const SCOPES = 'streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state playlist-read-private';

            const handleSpotifyLogin = async () => {
                const codeVerifier = generateRandomString(64);
                const hashed = await sha256(codeVerifier);
                const codeChallenge = base64encode(hashed);

                // Store the code verifier for later use
                window.localStorage.setItem('code_verifier', codeVerifier);

                const authUrl = new URL("https://accounts.spotify.com/authorize");
                const params = {
                    response_type: 'code',
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    code_challenge_method: 'S256',
                    code_challenge: codeChallenge,
                    redirect_uri: REDIRECT_URI,
                };

                authUrl.search = new URLSearchParams(params).toString();
                window.location.href = authUrl.toString();
            };

            // Exchange authorization code for access token
            const getAccessToken = async (code) => {
                const codeVerifier = window.localStorage.getItem('code_verifier');

                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        client_id: CLIENT_ID,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        code_verifier: codeVerifier,
                    }),
                });

                const data = await response.json();
                return data.access_token;
            };

            // Check for authorization code in URL on mount
            useEffect(() => {
                const args = new URLSearchParams(window.location.search);
                const code = args.get('code');

                if (code) {
                    getAccessToken(code).then(token => {
                        setSpotifyToken(token);
                        window.localStorage.removeItem('code_verifier');
                        // Clean up URL
                        window.history.replaceState({}, document.title, REDIRECT_URI);
                    }).catch(error => {
                        console.error('Error getting access token:', error);
                    });
                }
            }, []);

            useEffect(() => {
                if (spotifyToken && !player) {
                    // Load Spotify SDK script
                    const script = document.createElement('script');
                    script.src = 'https://sdk.scdn.co/spotify-player.js';
                    script.async = true;
                    
                    // Define the callback BEFORE loading the script
                    window.onSpotifyWebPlaybackSDKReady = () => {
                        const spotifyPlayer = new window.Spotify.Player({
                            name: 'Power Hour Player',
                            getOAuthToken: cb => { cb(spotifyToken); },
                            volume: 0.8
                        });

                        spotifyPlayer.addListener('ready', ({ device_id }) => {
                            console.log('Ready with Device ID', device_id);
                            setDeviceId(device_id);
                            setStep(2);
                        });

                        spotifyPlayer.addListener('not_ready', ({ device_id }) => {
                            console.log('Device ID has gone offline', device_id);
                        });

                        spotifyPlayer.connect();
                        setPlayer(spotifyPlayer);
                    };
                    
                    document.body.appendChild(script);
                }
            }, [spotifyToken, player]);

            const searchTracks = async () => {
                if (!spotifyToken) return;

                try {
                    let query = playlistCriteria.genre;
                    
                    if (playlistCriteria.timePeriod) {
                        const yearMatch = playlistCriteria.timePeriod.match(/(\d{4})/);
                        if (yearMatch) {
                            query += ` year:${yearMatch[1]}`;
                        }
                    }

                    const response = await fetch(
                        `https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=50`,
                        {
                            headers: {
                                'Authorization': `Bearer ${spotifyToken}`
                            }
                        }
                    );

                    const data = await response.json();
                    
                    if (data.tracks && data.tracks.items) {
                        const shuffled = data.tracks.items
                            .sort(() => 0.5 - Math.random())
                            .slice(0, gameSettings.rounds);
                        
                        setPlaylist(shuffled);
                        return shuffled;
                    }
                } catch (error) {
                    console.error('Error searching tracks:', error);
                    alert('Error searching for tracks. Please try again.');
                }
                return [];
            };

            const handleCreatePlaylist = async () => {
                const tracks = await searchTracks();
                if (tracks && tracks.length > 0) {
                    setStep(3);
                } else {
                    alert('No tracks found. Please try different criteria.');
                }
            };

            const playTrack = async (trackUri) => {
                if (!deviceId || !spotifyToken) return;

                try {
                    await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            uris: [trackUri]
                        }),
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${spotifyToken}`
                        }
                    });
                } catch (error) {
                    console.error('Error playing track:', error);
                }
            };

            const pausePlayback = async () => {
                if (!deviceId || !spotifyToken) return;

                try {
                    await fetch(`https://api.spotify.com/v1/me/player/pause?device_id=${deviceId}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${spotifyToken}`
                        }
                    });
                } catch (error) {
                    console.error('Error pausing:', error);
                }
            };

            const resumePlayback = async () => {
                if (!deviceId || !spotifyToken) return;

                try {
                    await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${spotifyToken}`
                        }
                    });
                } catch (error) {
                    console.error('Error resuming:', error);
                }
            };

            const handleStartGame = () => {
                if (playlist.length === 0) return;
                
                setStep(4);
                setCurrentRound(1);
                setTimeLeft(gameSettings.roundLength);
                const firstTrack = playlist[0];
                setCurrentTrack({
                    name: firstTrack.name,
                    artist: firstTrack.artists[0].name,
                    uri: firstTrack.uri
                });
                setIsPlaying(true);
                playTrack(firstTrack.uri);
            };

            useEffect(() => {
                if (isPlaying && step === 4) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                if (currentRound < playlist.length) {
                                    const nextTrack = playlist[currentRound];
                                    setCurrentRound(currentRound + 1);
                                    setCurrentTrack({
                                        name: nextTrack.name,
                                        artist: nextTrack.artists[0].name,
                                        uri: nextTrack.uri
                                    });
                                    playTrack(nextTrack.uri);
                                    return gameSettings.roundLength;
                                } else {
                                    setIsPlaying(false);
                                    pausePlayback();
                                    return 0;
                                }
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }

                return () => {
                    if (timerRef.current) {
                        clearInterval(timerRef.current);
                    }
                };
            }, [isPlaying, step, currentRound, playlist, gameSettings]);

            const togglePlayPause = async () => {
                if (isPlaying) {
                    await pausePlayback();
                    setIsPlaying(false);
                } else {
                    await resumePlayback();
                    setIsPlaying(true);
                }
            };

            const renderWheel = () => {
                const percentage = (timeLeft / gameSettings.roundLength) * 100;
                const dashArray = 2 * Math.PI * 90;
                const dashOffset = dashArray - (dashArray * percentage) / 100;
                const shouldBlur = timeLeft > 10;

                return (
                    <div className="flex flex-col items-center justify-center space-y-8">
                        <div className="relative w-80 h-80">
                            <svg className="transform -rotate-90 w-80 h-80">
                                <circle
                                    cx="160"
                                    cy="160"
                                    r="90"
                                    stroke="#e5e7eb"
                                    strokeWidth="20"
                                    fill="none"
                                />
                                <circle
                                    cx="160"
                                    cy="160"
                                    r="90"
                                    stroke="#3b82f6"
                                    strokeWidth="20"
                                    fill="none"
                                    strokeDasharray={dashArray}
                                    strokeDashoffset={dashOffset}
                                    className="transition-all duration-1000"
                                    strokeLinecap="round"
                                />
                            </svg>
                            <div className="absolute inset-0 flex flex-col items-center justify-center">
                                <div className={`text-center px-8 transition-all duration-500 ${shouldBlur ? 'blur-md' : ''}`}>
                                    <div className="text-xl font-bold mb-2">{currentTrack?.name}</div>
                                    <div className="text-gray-600">{currentTrack?.artist}</div>
                                </div>
                                <div className="text-4xl font-bold mt-4">{timeLeft}s</div>
                            </div>
                        </div>

                        <div className="flex items-center space-x-4">
                            <button
                                onClick={togglePlayPause}
                                className="bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-full transition-colors shadow-lg"
                            >
                                {isPlaying ? <PauseIcon /> : <PlayIcon />}
                            </button>
                        </div>

                        <div className="text-center">
                            <div className="text-2xl font-bold">Round {currentRound} of {playlist.length}</div>
                        </div>

                        {currentRound >= playlist.length && timeLeft === 0 && (
                            <div className="text-center mt-4">
                                <div className="text-3xl font-bold text-green-600">Game Complete! 🎉</div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 p-8">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-xl p-8">
                            <div className="flex items-center justify-center mb-8">
                                <div className="text-blue-600 mr-3">
                                    <MusicIcon />
                                </div>
                                <h1 className="text-4xl font-bold text-gray-800">Power Hour</h1>
                            </div>

                            {step === 1 && (
                                <div className="text-center space-y-6">
                                    <h2 className="text-2xl font-semibold mb-4">Step 1: Connect to Spotify</h2>
                                    <p className="text-gray-600 mb-6">
                                        Connect your Spotify account to create your custom Power Hour playlist
                                    </p>
                                    <button
                                        onClick={handleSpotifyLogin}
                                        className="bg-green-600 hover:bg-green-700 text-white px-8 py-4 rounded-full text-lg font-semibold transition-colors shadow-lg"
                                    >
                                        Login with Spotify
                                    </button>
                                    <div className="mt-8 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                                        <p className="text-sm text-gray-700">
                                            You'll be redirected to Spotify to log in with your username and password. 
                                            Make sure you have Spotify Premium to use the playback features.
                                        </p>
                                    </div>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-semibold mb-4">Step 2: Create Your Playlist</h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Genre *
                                            </label>
                                            <input
                                                type="text"
                                                value={playlistCriteria.genre}
                                                onChange={(e) => setPlaylistCriteria({...playlistCriteria, genre: e.target.value})}
                                                placeholder="e.g., Pop, Rock, Hip Hop"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Time Period (Optional)
                                            </label>
                                            <input
                                                type="text"
                                                value={playlistCriteria.timePeriod}
                                                onChange={(e) => setPlaylistCriteria({...playlistCriteria, timePeriod: e.target.value})}
                                                placeholder="e.g., 2000s, 1990, 2010-2020"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            />
                                        </div>
                                        <button
                                            onClick={handleCreatePlaylist}
                                            disabled={!playlistCriteria.genre}
                                            className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white px-6 py-3 rounded-lg font-semibold transition-colors"
                                        >
                                            Create Playlist
                                        </button>
                                    </div>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-semibold mb-4">Step 3: Game Settings</h2>
                                    <div className="p-4 bg-green-50 border border-green-200 rounded-lg mb-4">
                                        <p className="text-sm text-green-800">
                                            ✓ Found {playlist.length} tracks matching your criteria!
                                        </p>
                                    </div>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Number of Rounds
                                            </label>
                                            <input
                                                type="number"
                                                value={gameSettings.rounds}
                                                onChange={(e) => setGameSettings({...gameSettings, rounds: Math.min(parseInt(e.target.value) || 1, playlist.length)})}
                                                min="1"
                                                max={playlist.length}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            />
                                            <p className="text-xs text-gray-500 mt-1">Max: {playlist.length} tracks</p>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Round Length (seconds)
                                            </label>
                                            <input
                                                type="number"
                                                value={gameSettings.roundLength}
                                                onChange={(e) => setGameSettings({...gameSettings, roundLength: parseInt(e.target.value) || 10})}
                                                min="10"
                                                max="300"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            />
                                        </div>
                                        <button
                                            onClick={handleStartGame}
                                            className="w-full bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-semibold text-lg transition-colors shadow-lg"
                                        >
                                            Start Power Hour!
                                        </button>
                                    </div>
                                </div>
                            )}

                            {step === 4 && renderWheel()}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PowerHourGame />);
    </script>
</body>
</html>
