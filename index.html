/* =======================
   PKCE HELPERS
======================= */
function generateRandomString(length) {
    const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    const values = crypto.getRandomValues(new Uint8Array(length));
    return values.reduce((acc, x) => acc + possible[x % possible.length], "");
}

async function sha256(plain) {
    const encoder = new TextEncoder();
    return crypto.subtle.digest('SHA-256', encoder.encode(plain));
}

function base64encode(input) {
    return btoa(String.fromCharCode(...new Uint8Array(input)))
        .replace(/=/g, '')
        .replace(/\+/g, '-')
        .replace(/\//g, '_');
}

    const SCOPES = "streaming user-read-private user-modify-playback-state user-read-playback-state";

    /* =======================
       AUTH
    ======================= */
    const handleSpotifyLogin = async () => {
        const verifier = generateRandomString(64);
        const challenge = base64encode(await sha256(verifier));
        localStorage.setItem("verifier", verifier);

        const url = new URL("https://accounts.spotify.com/authorize");
        url.search = new URLSearchParams({
            response_type: "code",
            client_id: CLIENT_ID,
            scope: SCOPES,
            redirect_uri: REDIRECT_URI,
            code_challenge_method: "S256",
            code_challenge: challenge
        });
        window.location.href = url.toString();
    };

    useEffect(() => {
        const code = new URLSearchParams(window.location.search).get("code");
        if (!code) return;

        fetch("https://accounts.spotify.com/api/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({
                client_id: CLIENT_ID,
                grant_type: "authorization_code",
                code,
                redirect_uri: REDIRECT_URI,
                code_verifier: localStorage.getItem("verifier")
            })
        })
        .then(r => r.json())
        .then(d => {
            setSpotifyToken(d.access_token);
            window.history.replaceState({}, "", REDIRECT_URI);
        });
    }, []);

    /* =======================
       PLAYER SDK
    ======================= */
    useEffect(() => {
        if (!spotifyToken) return;

        const script = document.createElement("script");
        script.src = "https://sdk.scdn.co/spotify-player.js";
        script.onload = () => {
            const player = new Spotify.Player({
                name: "Power Hour",
                getOAuthToken: cb => cb(spotifyToken)
            });

            player.addListener("ready", ({ device_id }) => {
                setDeviceId(device_id);
                setStep(2);
            });

            player.connect();
        };
        document.body.appendChild(script);
    }, [spotifyToken]);

    /* =======================
       PLAYLIST BUILDING
    ======================= */
    const searchTracks = async () => {
        const res = await fetch(
            `https://api.spotify.com/v1/search?q=${encodeURIComponent(
                playlistCriteria.genrePlaylist
            )}&type=playlist&limit=1`,
            { headers: { Authorization: `Bearer ${spotifyToken}` } }
        );
        const playlistData = await res.json();
        const playlistId = playlistData.playlists.items[0].id;

        const tracksRes = await fetch(
            `https://api.spotify.com/v1/playlists/${playlistId}/tracks?limit=100`,
            { headers: { Authorization: `Bearer ${spotifyToken}` } }
        );
        const tracksData = await tracksRes.json();

        const tracks = tracksData.items
            .filter(i => i.track)
            .map(i => i.track)
            .sort(() => 0.5 - Math.random())
            .slice(0, gameSettings.rounds);

        setPlaylist(tracks);
        setStep(3);
    };

    /* =======================
       GAME LOOP
    ======================= */
    useEffect(() => {
        if (!isPlaying) return;
        timerRef.current = setInterval(() => {
            setTimeLeft(t => {
                if (t <= 1) {
                    if (currentRound < playlist.length) {
                        const track = playlist[currentRound];
                        fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                            method: "PUT",
                            headers: {
                                Authorization: `Bearer ${spotifyToken}`,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ uris: [track.uri] })
                        });
                        setCurrentTrack(track);
                        setCurrentRound(r => r + 1);
                        return gameSettings.roundLength;
                    }
                    setIsPlaying(false);
                    return 0;
                }
                return t - 1;
            });
        }, 1000);
        return () => clearInterval(timerRef.current);
    }, [isPlaying]);

    /* =======================
       UI
    ======================= */
    if (step === 1) {
